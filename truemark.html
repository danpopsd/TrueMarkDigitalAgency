  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { font-family: 'Inter', sans-serif; background: #f4f4f4; color: #111; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; }
    input, select, textarea, button { font-family: 'Inter', sans-serif; }
    .tm-spin { animation: tmSpin 0.8s linear infinite; }
    @keyframes tmSpin { to { transform: rotate(360deg); } }
    .tm-pulse { animation: tmPulse 1.2s ease-in-out infinite; }
    @keyframes tmPulse { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .tm-fade { animation: tmFade 0.45s ease forwards; }
    @keyframes tmFade { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    .tm-ticker { animation: tmTick 34s linear infinite; }
    @keyframes tmTick { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    input:focus, select:focus, textarea:focus { outline: 2px solid #111; outline-offset: 1px; }
    @media print {
      .no-print { display: none !important; }
      body { background: white; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const T = {
      bg:"#f4f4f4", white:"#ffffff", dark:"#111111", dark2:"#1c1c1c",
      border:"#dedede", border2:"#2a2a2a", text:"#111111", sub:"#555555",
      mute:"#909090", red:"#c0392b", red2:"#a93226",
      green:"#166534", greenBg:"#dcfce7",
      amber:"#92400e", amberBg:"#fef3c7",
      redBg:"#fee2e2", redText:"#991b1b",
    };

    const VIEWS = { LANDING:"landing", AUDIT:"audit", LOADING:"loading", RESULTS:"results", ERROR:"error" };

    // ── Shared ──────────────────────────────────────────────────
    function LabelCenter({ children }) {
      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,
          fontFamily:"'DM Mono',monospace",fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",
          color:T.red,marginBottom:12}}>
          <span style={{width:16,height:1,background:T.red,display:"block"}}/>
          {children}
          <span style={{width:16,height:1,background:T.red,display:"block"}}/>
        </div>
      );
    }

    function LabelLeft({ children }) {
      return (
        <div style={{display:"inline-flex",alignItems:"center",gap:8,fontFamily:"'DM Mono',monospace",
          fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",color:T.red,marginBottom:12}}>
          <span style={{width:16,height:1,background:T.red,display:"block"}}/>
          {children}
        </div>
      );
    }

    function Btn({ children, onClick, variant="red", style={}, disabled=false }) {
      const v = {
        red:{background:T.red,color:"#fff",border:"none"},
        dark:{background:T.dark,color:"#fff",border:"none"},
        outline:{background:"transparent",color:T.text,border:`1.5px solid ${T.border}`},
        white:{background:"#fff",color:T.red,border:"none"},
        outlineWhite:{background:"transparent",color:"#fff",border:"1.5px solid rgba(255,255,255,0.4)"},
      };
      return (
        <button onClick={onClick} disabled={disabled}
          style={{fontFamily:"'Inter',sans-serif",fontSize:15,fontWeight:700,padding:"0.85rem 1.75rem",
            borderRadius:2,cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.5:1,
            transition:"opacity 0.15s",whiteSpace:"nowrap",...v[variant],...style}}
          onMouseEnter={e=>!disabled&&(e.target.style.opacity="0.85")}
          onMouseLeave={e=>!disabled&&(e.target.style.opacity="1")}>
          {children}
        </button>
      );
    }

    // ── API ─────────────────────────────────────────────────────
    async function runClaudeAudit({ bizName, bizCategory, bizCity, bizWebsite, bizChallenge, contactName, contactEmail }) {
      const prompt = `You are a senior local SEO analyst at True Mark Digital Agency. Conduct a thorough local SEO audit for the following business and return ONLY valid JSON — no markdown, no preamble, no explanation.

BUSINESS:
- Name: ${bizName}
- Category: ${bizCategory}
- Location: ${bizCity}
- Website: ${bizWebsite || "Not provided"}
- Challenge: ${bizChallenge || "Not stated"}
- Contact: ${contactName} (${contactEmail})

Be realistic and specific. Assess typical patterns for a ${bizCategory} business in ${bizCity}. Be direct — do not be generically optimistic.

Return exactly this JSON structure:
{
  "overallScore": <0-100 integer>,
  "scoreSummary": "<2-3 sentences: direct honest assessment of their current local search situation>",
  "recommendedPackage": "<Presence|Authority|Dominant>",
  "packageReason": "<1 sentence explaining why this package fits>",
  "signals": [
    { "name": "GBP Presence", "score": "<N/10>", "status": "<poor|warn|good>", "desc": "<one sentence>" },
    { "name": "Review Strength", "score": "<N/10>", "status": "<poor|warn|good>", "desc": "<one sentence>" },
    { "name": "Local Rankings", "score": "<N/10>", "status": "<poor|warn|good>", "desc": "<one sentence>" },
    { "name": "Citation Accuracy", "score": "<N/10>", "status": "<poor|warn|good>", "desc": "<one sentence>" },
    { "name": "Website SEO", "score": "<N/10>", "status": "<poor|warn|good>", "desc": "<one sentence>" },
    { "name": "Competitor Gap", "score": "<N/10>", "status": "<poor|warn|good>", "desc": "<one sentence>" }
  ],
  "sections": [
    {
      "icon": "📍", "title": "Google Business Profile",
      "status": "<poor|warn|good>", "statusLabel": "<Needs Work|Partially Optimized|Well Optimized>",
      "findings": [
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences specific to this business>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" }
      ]
    },
    {
      "icon": "⭐", "title": "Reviews & Reputation",
      "status": "<poor|warn|good>", "statusLabel": "<Needs Work|Developing|Strong>",
      "findings": [
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" }
      ]
    },
    {
      "icon": "🔍", "title": "Local Search Visibility",
      "status": "<poor|warn|good>", "statusLabel": "<Low Visibility|Moderate Visibility|High Visibility>",
      "findings": [
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" }
      ]
    },
    {
      "icon": "📋", "title": "Citations & Directories",
      "status": "<poor|warn|good>", "statusLabel": "<Incomplete|Partial|Complete>",
      "findings": [
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" }
      ]
    },
    {
      "icon": "🌐", "title": "Website & On-Page SEO",
      "status": "<poor|warn|good>", "statusLabel": "<Needs Work|Partially Optimized|Well Optimized>",
      "findings": [
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" },
        { "type": "<issue|warning|good>", "title": "<short>", "detail": "<1-2 sentences>" }
      ]
    }
  ],
  "priorities": [
    { "title": "<action>", "detail": "<why + what>", "impact": "<high|medium|low>" },
    { "title": "<action>", "detail": "<why + what>", "impact": "<high|medium|low>" },
    { "title": "<action>", "detail": "<why + what>", "impact": "<high|medium|low>" },
    { "title": "<action>", "detail": "<why + what>", "impact": "<high|medium|low>" },
    { "title": "<action>", "detail": "<why + what>", "impact": "<high|medium|low>" }
  ],

    "intro": "<2-3 sentences: personal, direct, speaks to their specific situation>",
    "whatWeDo": "<2-3 sentences: specific deliverables for their recommended package>",
    "expectedOutcome": "<1-2 sentences: realistic outcome based on their score and category>",
    "urgency": "<1 sentence: specific reason why acting now matters>",
    "nextStep": "<1 sentence: clear single call to action>"
  }
}`;

      // Cloudflare Worker proxy — keeps your API key secure
      const WORKER_URL = "https://truemark-audit.danpopsd.workers.dev";

      const res = await fetch(WORKER_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ bizName, bizCategory, bizCity, bizWebsite, bizChallenge, contactName, contactEmail })
      });
      if (!res.ok) {
        const errData = await res.json().catch(()=>({}));
        throw new Error(errData.error || `Request failed (${res.status})`);
      }
      const auditResult = await res.json();
      if (auditResult.error) throw new Error(auditResult.error);
      return auditResult;
    }

        {num:"266%",label:"More leads with\n50+ Google reviews"},

      const statsBand = [

      const cases = [
        {type:"Photography — Commercial",client:"DanPop SD",sub:"Commercial photographer · Oceanside, CA",m1:"+180%",m1l:"Profile Views",m2:"#1",m2l:"Map Pack",desc:"Full GBP buildout, local citation network, and SEO restructuring that elevated a solo commercial photographer to the top local position in San Diego County.",url:"https://www.danpopsd.com"},
        {type:"Photography — Studio",client:"True Grain Studios",sub:"Film and portrait studio · Oceanside, CA",m1:"+240%",m1l:"Organic Reach",m2:"4.9★",m2l:"Review Score",desc:"Studio launch presence buildout including GBP optimization, automated review velocity, and local SEO targeting wedding, portrait, and commercial clients across North San Diego County.",url:"https://www.truegrainstudios.com"},
        {type:"Creative — Multi-Property",client:"True Grain — Editorial",sub:"Commercial and editorial · San Diego, CA",m1:"3X",m1l:"Inbound Leads",m2:"Top 3",m2l:"Search Position",desc:"Multi-property SEO strategy, cross-listing authority building, and brand presence consolidation across three web properties for a commercial photography and production brand.",url:"https://www.danpopsd.com/true-grain-studios"},

      return (
        <div style={{fontFamily:"'Inter',sans-serif",background:T.bg,minHeight:"100vh",color:T.text}}>

          {/* NAV */}

            <div style={{maxWidth:1120,margin:"0 auto",padding:"0 2rem",height:62,
              display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:"0.14em",color:T.text}}>
                TRUE<span style={{color:T.red}}>MARK</span>
              </span>
              {!pw && (
                <div style={{display:"flex",gap:28,alignItems:"center"}}>
                  {[["#how","How It Works"],["#services","Services"],["#pricing","Pricing"],["#guarantee","Guarantee"],["#results","Results"]].map(([h,l]) =>

                  <Btn variant="outline"><a href="#how" style={{textDecoration:"none",color:"inherit",display:"block",padding:"0 0.25rem"}}>See How It Works</a></Btn>

                  textTransform:"uppercase",color:"#666",marginBottom:20}}>What Local SEO Delivers</p>
                {heroStats.map((s,i)=>(
                  <div key={i} style={{padding:"1rem 0",borderBottom:i<3?`1px solid ${T.border2}`:"none",
                    display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:12}}>
                    <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:40,lineHeight:1,color:s.r?T.red:"#fff"}}>{s.num}</span>
                    <span style={{fontSize:12,color:"#888",lineHeight:1.4,textAlign:"right",whiteSpace:"pre-line"}}>{s.label}</span>

                <div style={{marginTop:20,padding:"0.9rem 1rem",background:"rgba(192,57,43,0.12)",
                  border:"1px solid rgba(192,57,43,0.25)",borderRadius:2}}>
                  <p style={{fontSize:12,color:"#bbb",lineHeight:1.5}}>

                  </p>

          {/* STATS BAND */}
          <div style={{background:T.white,borderBottom:`1px solid ${T.border}`,padding:"3.5rem 0"}}>
            <div style={{maxWidth:1120,margin:"0 auto",padding:"0 2rem"}}>
              <div style={{display:"grid",gridTemplateColumns:pw?"1fr 1fr":"repeat(4,1fr)",gap:1,

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:20,marginBottom:24,flexWrap:"wrap"}}>
                <div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:pw?28:36,color:"#fff",letterSpacing:"0.03em",marginBottom:6}}>{formData.bizName}</div>
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",color:"#555"}}>{formData.bizCategory} · {formData.bizCity}</div>
                </div>
                <div style={{textAlign:"center",flexShrink:0}}>
                  <div style={{width:88,height:88,borderRadius:"50%",border:`3px solid ${scoreColor}`,
                    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
                    <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:32,color:scoreColor,lineHeight:1}}>{overallScore}</span>
                    <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,color:"#666"}}>/100</span>
                  </div>
                  <div style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:"0.15em",textTransform:"uppercase",color:"#555",marginTop:6}}>Overall Score</div>
                </div>
              </div>
              <div style={{fontSize:14,color:"#bbb",lineHeight:1.7,paddingTop:20,borderTop:`1px solid ${T.border2}`}}>{scoreSummary}</div>
            </div>

            {/* Signals */}
            <div className="tm-fade" style={{display:"grid",gridTemplateColumns:pw?"1fr 1fr":"repeat(3,1fr)",gap:1,
              background:T.border,border:`1px solid ${T.border}`,borderRadius:2,marginBottom:20}}>
              {signals.map((s,i)=>(
                <div key={i} style={{background:T.white,padding:"1.25rem 1.1rem"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:T.mute}}>{s.name}</span>
                    <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:"0.1em",textTransform:"uppercase",
                      padding:"0.2rem 0.5rem",borderRadius:2,background:badge[s.status]?.bg,color:badge[s.status]?.color}}>
                      {badge[s.status]?.label}
                    </span>
                  </div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:T.text,lineHeight:1,marginBottom:6}}>{s.score}</div>
                  <div style={{fontSize:12,color:T.sub,lineHeight:1.4}}>{s.desc}</div>
                </div>
              ))}
            </div>

            {/* Sections */}
            {sections.map((sec,i)=>(
              <div key={i} className="tm-fade" style={{background:T.white,border:`1px solid ${T.border}`,borderRadius:2,marginBottom:16,overflow:"hidden"}}>
                <div style={{padding:"1.1rem 1.5rem",borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:12}}>
                  <span style={{fontSize:18}}>{sec.icon}</span>
                  <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:T.text,letterSpacing:"0.03em",flex:1}}>{sec.title}</span>
                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:"0.12em",textTransform:"uppercase",
                    padding:"0.22rem 0.6rem",borderRadius:2,background:badge[sec.status]?.bg,color:badge[sec.status]?.color}}>
                    {sec.statusLabel}
                  </span>
                </div>
                <div style={{padding:"0 1.5rem"}}>
                  {sec.findings.map((f,j)=>(
                    <div key={j} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"0.85rem 0",
                      borderBottom:j<sec.findings.length-1?`1px solid ${T.border}`:"none"}}>
                      <span style={{fontSize:14,flexShrink:0,marginTop:2}}>{findIcon[f.type]}</span>
                      <div style={{fontSize:14,color:T.sub,lineHeight:1.55}}>
                        <strong style={{color:T.text,display:"block",marginBottom:3}}>{f.title}</strong>
                        {f.detail}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}

            {/* Priorities */}
            <div className="tm-fade" style={{background:T.dark,borderRadius:2,marginBottom:20,overflow:"hidden"}}>
              <div style={{padding:"1.1rem 1.5rem",borderBottom:`1px solid ${T.border2}`,display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:18}}>🎯</span>
                <h3 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,color:"#fff",letterSpacing:"0.03em"}}>Your Priority Action Plan</h3>
              </div>
              {priorities.map((p,i)=>(
                <div key={i} style={{padding:"1rem 1.5rem",borderBottom:i<priorities.length-1?`1px solid ${T.border2}`:"none",
                  display:"grid",gridTemplateColumns:pw?"1.5rem 1fr":"1.75rem 1fr auto",gap:pw?12:16,alignItems:"start"}}>
                  <span style={{fontFamily:"'DM Mono',monospace",fontSize:10,color:T.red,paddingTop:3}}>0{i+1}</span>
                  <div>
                    <strong style={{fontSize:14,color:"#fff",display:"block",marginBottom:4}}>{p.title}</strong>
                    <p style={{fontSize:13,color:"#888",lineHeight:1.55}}>{p.detail}</p>
                  </div>
                  {!pw && <span style={{fontFamily:"'DM Mono',monospace",fontSize:9,letterSpacing:"0.1em",textTransform:"uppercase",
                    padding:"0.22rem 0.5rem",borderRadius:2,whiteSpace:"nowrap",alignSelf:"start",
                    ...impactStyle[p.impact]}}>{impactLabel[p.impact]}</span>}
                </div>
              ))}
            </div>

            {/* Proposal */}
            <div className="tm-fade" style={{background:T.white,border:`1px solid ${T.border}`,borderRadius:2,padding:pw?"1.75rem":"2.5rem",marginBottom:20}}>
              <LabelLeft>Your Custom Proposal</LabelLeft>
              <p style={{fontSize:15,color:T.sub,lineHeight:1.75,marginBottom:16}}>{proposal.intro}</p>
              <p style={{fontSize:15,color:T.sub,lineHeight:1.75,marginBottom:16}}>{proposal.whatWeDo}</p>
              <p style={{fontSize:15,color:T.sub,lineHeight:1.75,marginBottom:24}}>{proposal.expectedOutcome}</p>

              <div style={{background:T.bg,border:`1px solid ${T.border}`,padding:"1.25rem 1.5rem",borderRadius:2,marginBottom:20}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
                  <div>
                    <div style={{fontFamily:"'DM Mono',monospace",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",color:T.mute,marginBottom:4}}>Recommended Package</div>
                    <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:T.text,letterSpacing:"0.03em"}}>{recommendedPackage} — {pkgPrices[recommendedPackage]}</div>
                    <div style={{fontSize:14,color:T.sub,marginTop:4}}>{packageReason}</div>
                  </div>
                  <span style={{background:T.red,color:"#fff",fontFamily:"'DM Mono',monospace",fontSize:10,
                    letterSpacing:"0.15em",textTransform:"uppercase",padding:"0.22rem 0.7rem",borderRadius:2}}>Best Fit</span>
                </div>
              </div>

              <div style={{background:"rgba(192,57,43,0.06)",border:"1px solid rgba(192,57,43,0.15)",
                padding:"1rem 1.25rem",borderRadius:2,marginBottom:24}}>
                <p style={{fontSize:14,color:T.sub,lineHeight:1.55}}>
                  <strong style={{color:T.text}}>Why act now: </strong>{proposal.urgency}
                </p>
              </div>

              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                <button onClick={()=>window.open(`mailto:truemarkdigitalagency@gmail.com?subject=Audit Report — ${formData.bizName}&body=Hi, I received my free audit and am ready to get started with the ${recommendedPackage} package.`,"_blank")}
                  style={{fontFamily:"'Inter',sans-serif",fontSize:15,fontWeight:700,padding:"0.9rem 1.75rem",
                    background:T.red,color:"#fff",border:"none",borderRadius:2,cursor:"pointer"}}>
                  Get Started — Email Us Your Report
                </button>
                <button onClick={onReset}
                  style={{fontFamily:"'Inter',sans-serif",fontSize:15,fontWeight:600,color:T.sub,
                    background:"none",border:`1.5px solid ${T.border}`,padding:"0.9rem 1.75rem",borderRadius:2,cursor:"pointer"}}>
                  Run Another Audit
                </button>
              </div>
              <p style={{fontSize:13,color:T.mute,marginTop:10}}>
                Or email: <a href="mailto:truemarkdigitalagency@gmail.com" style={{color:T.red}}>truemarkdigitalagency@gmail.com</a> — reference your audit for {formData.bizName}.
              </p>
            </div>
          </div>
        </div>
      );
    }

    // ── ERROR ────────────────────────────────────────────────────
    function ErrorScreen({ message, onReset }) {
      return (
        <div style={{fontFamily:"'Inter',sans-serif",background:T.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"2rem"}}>
          <div style={{maxWidth:480,width:"100%",background:T.white,border:"1px solid #fca5a5",padding:"2.5rem",borderRadius:2,textAlign:"center"}}>
            <h3 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:T.red,letterSpacing:"0.03em",marginBottom:8}}>Audit Could Not Complete</h3>
            <p style={{fontSize:14,color:T.sub,marginBottom:24,lineHeight:1.6}}>{message}</p>
            <p style={{fontSize:13,color:T.mute,marginBottom:24}}>Please try again. If the problem continues, email us at truemarkdigitalagency@gmail.com and we will run your audit manually within a few hours.</p>
            <button onClick={onReset} style={{fontFamily:"'Inter',sans-serif",fontSize:15,fontWeight:700,padding:"0.85rem 1.75rem",background:T.dark,color:"#fff",border:"none",borderRadius:2,cursor:"pointer"}}>Try Again</button>
          </div>
        </div>
      );
    }

    // ── ROOT ─────────────────────────────────────────────────────
    function App() {
      const [view, setView] = useState(VIEWS.LANDING);
      const [formData, setFormData] = useState(null);
      const [auditData, setAuditData] = useState(null);
      const [currentStep, setCurrentStep] = useState(0);
      const [errorMsg, setErrorMsg] = useState("");

      const go = v => { setView(v); window.scrollTo(0,0); };

      const handleSubmit = async (form) => {
        setFormData(form);
        setCurrentStep(0);
        go(VIEWS.LOADING);

        let step = 0;
        const interval = setInterval(()=>{ step++; setCurrentStep(step); if(step>=6) clearInterval(interval); }, 900);

        try {
          const result = await runClaudeAudit(form);
          clearInterval(interval);
          setCurrentStep(7);
          setTimeout(()=>{ setAuditData(result); go(VIEWS.RESULTS); }, 600);
        } catch(err) {
          clearInterval(interval);
          setErrorMsg(err.message || "Something went wrong. Please try again.");
          go(VIEWS.ERROR);
        }
      };

      const reset = () => { setView(VIEWS.LANDING); setFormData(null); setAuditData(null); setCurrentStep(0); window.scrollTo(0,0); };

      if (view === VIEWS.LANDING)  return <Landing onStartAudit={()=>go(VIEWS.AUDIT)} />;
      if (view === VIEWS.AUDIT)    return <AuditForm onSubmit={handleSubmit} onBack={()=>go(VIEWS.LANDING)} />;
      if (view === VIEWS.LOADING)  return <LoadingScreen currentStep={currentStep} />;
      if (view === VIEWS.RESULTS)  return <ResultsPage data={auditData} formData={formData} onReset={reset} />;
      if (view === VIEWS.ERROR)    return <ErrorScreen message={errorMsg} onReset={reset} />;
      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
